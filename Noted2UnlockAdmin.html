<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyS6G-Y_h9w5oYunatsu0Wihhds_hJ6QfZT2tMdclasP9R9HEfKeiAQsTTPPCRLZOg/exec';
    let noteIndex = 1;
    
    // Theme switch functionality
    const toggleSwitch = document.querySelector('#checkbox');
    const currentTheme = localStorage.getItem('theme');
    
    if (currentTheme) {
      document.body.classList.add(currentTheme);
      if (currentTheme === 'dark-theme') {
        toggleSwitch.checked = true;
      }
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark-theme');
      toggleSwitch.checked = true;
      localStorage.setItem('theme', 'dark-theme');
    }
    
    function switchTheme(e) {
      if (e.target.checked) {
        document.body.classList.add('dark-theme');
        localStorage.setItem('theme', 'dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
        localStorage.setItem('theme', 'light-theme');
      }
    }
    
    toggleSwitch.addEventListener('change', switchTheme, false);
    
    // Add new note form
    document.getElementById('addNoteBtn').addEventListener('click', function() {
      const container = document.getElementById('notesContainer');
      const newNoteItem = createNoteItem(noteIndex);
      container.appendChild(newNoteItem);
      noteIndex++;
      updateNoteCount();
      updateRemoveButtons();
      
      // Animate the new item
      newNoteItem.style.opacity = '0';
      newNoteItem.style.transform = 'translateY(20px)';
      setTimeout(() => {
        newNoteItem.style.transition = 'all 0.5s ease';
        newNoteItem.style.opacity = '1';
        newNoteItem.style.transform = 'translateY(0)';
      }, 10);
    });
    
    // Create note item
    function createNoteItem(index) {
      const noteItem = document.createElement('div');
      noteItem.className = 'note-item';
      noteItem.setAttribute('data-index', index);
      noteItem.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 text-primary">
            <i class="bi bi-sticky me-2"></i>
            Note #${index + 1}
          </h6>
          <button type="button" class="btn btn-danger btn-sm remove-note-btn">
            <i class="bi bi-trash"></i>
          </button>
        </div>
        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label">
              <i class="bi bi-tag text-primary"></i>
              Nama Note
            </label>
            <input type="text" class="form-control nama-note" placeholder="Masukkan nama note..." required>
          </div>
          <div class="col-md-12 mb-3">
            <label class="form-label">
              <i class="bi bi-pencil text-primary"></i>
              Konten Note
            </label>
            <textarea class="form-control note-content" placeholder="Masukkan konten note..." required></textarea>
          </div>
        </div>
      `;
      

      
      // Add remove functionality
      noteItem.querySelector('.remove-note-btn').addEventListener('click', function() {
        noteItem.style.transition = 'all 0.3s ease';
        noteItem.style.opacity = '0';
        noteItem.style.transform = 'translateX(-100%)';
        setTimeout(() => {
          noteItem.remove();
          updateNoteCount();
          updateRemoveButtons();
          updateNoteNumbers();
        }, 300);
      });
      
      return noteItem;
    }
    
    // Update note count
    function updateNoteCount() {
      const count = document.querySelectorAll('.note-item').length;
      document.getElementById('noteCount').textContent = count;
    }
    
    // Update remove buttons visibility
    function updateRemoveButtons() {
      const noteItems = document.querySelectorAll('.note-item');
      const removeButtons = document.querySelectorAll('.remove-note-btn');
      
      if (noteItems.length <= 1) {
        removeButtons.forEach(btn => btn.style.display = 'none');
      } else {
        removeButtons.forEach(btn => btn.style.display = 'block');
      }
    }
    
    // Update note numbers
    function updateNoteNumbers() {
      const noteItems = document.querySelectorAll('.note-item');
      noteItems.forEach((item, index) => {
        const title = item.querySelector('h6');
        title.innerHTML = `
          <i class="bi bi-sticky me-2"></i>
          Note #${index + 1}
        `;
      });
    }
    
    // Form submission
    document.getElementById('bulkNoteForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const noteItems = document.querySelectorAll('.note-item');
      const notes = [];
      
      // Collect all note data
      noteItems.forEach(item => {
        const namaNote = item.querySelector('.nama-note').value;
        const noteContent = item.querySelector('.note-content').value;
        
        if (namaNote && noteContent) {
          notes.push({
            nama_note: namaNote,
            note_content: noteContent
          });
        }
      });
      
      if (notes.length === 0) {
        showNotification('Mohon isi minimal satu note!', 'error');
        return;
      }
      
      // Show loading state
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memproses...';
      
      try {
        const results = [];
        
        // Process each note
        for (let i = 0; i < notes.length; i++) {
          const note = notes[i];
          const payload = {
            action: 'create',
            nama_note: note.nama_note,
            note_content: note.note_content
          };
          
          try {
            const response = await fetch(SCRIPT_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams(payload)
            });
            
            const data = await response.json();
            
            if (data.status === 'success') {
              results.push({
                nama_note: note.nama_note,
                shareableLink: data.data.shareableLink,
                success: true
              });
            } else {
              results.push({
                nama_note: note.nama_note,
                error: data.message,
                success: false
              });
            }
          } catch (error) {
            results.push({
              nama_note: note.nama_note,
              error: error.message,
              success: false
            });
          }
          
          // Update progress
          submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memproses... (${i + 1}/${notes.length})`;
        }
        
        // Display results
        displayResults(results);
        
        // Reset form
        document.getElementById('bulkNoteForm').reset();
        
        // Show success notification
        const successCount = results.filter(r => r.success).length;
        const errorCount = results.filter(r => !r.success).length;
        
        if (successCount > 0) {
          showNotification(`${successCount} note berhasil dibuat${errorCount > 0 ? `, ${errorCount} gagal` : ''}!`, 'success');
        }
        if (errorCount > 0 && successCount === 0) {
          showNotification(`Semua note gagal dibuat!`, 'error');
        }
        
      } catch (error) {
        showNotification('Terjadi kesalahan: ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
      }
    });
    
    // Display results
    function displayResults(results) {
      const resultContainer = document.getElementById('resultContainer');
      const resultsContainer = document.getElementById('resultsContainer');
      
      resultsContainer.innerHTML = '';
      
      results.forEach((result, index) => {
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        
        if (result.success) {
          resultItem.innerHTML = `
            <h6><i class="bi bi-sticky me-2"></i>${result.nama_note}</h6>
            <div class="input-group mb-2">
              <input type="text" class="form-control" value="${result.shareableLink}" readonly>
              <button class="btn btn-outline-secondary copy-btn" type="button" data-link="${result.shareableLink}">
                <i class="bi bi-clipboard"></i>
                Copy
              </button>
            </div>
          `;
        } else {
          resultItem.className += ' border-danger';
          resultItem.style.background = 'rgba(239, 68, 68, 0.05)';
          resultItem.innerHTML = `
            <h6 class="text-danger"><i class="bi bi-sticky me-2"></i>${result.nama_note}</h6>
            <div class="alert alert-danger mb-0">
              <i class="bi bi-x-circle me-2"></i>
              Error: ${result.error}
            </div>
          `;
        }
        
        resultsContainer.appendChild(resultItem);
      });
      
      // Add copy functionality
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const link = this.getAttribute('data-link');
          copyToClipboard(link, this);
        });
      });
      
      resultContainer.style.display = 'block';
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }
    
    // Copy to clipboard
    function copyToClipboard(text, button) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyFeedback(button);
        });
      } else {
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showCopyFeedback(button);
      }
    }
    
    // Show copy feedback
    function showCopyFeedback(button) {
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="bi bi-check"></i> Copied!';
      button.classList.remove('btn-outline-secondary');
      button.classList.add('btn-success');
      
      setTimeout(() => {
        button.innerHTML = originalHTML;
        button.classList.remove('btn-success');
        button.classList.add('btn-outline-secondary');
      }, 2000);
      
      showNotification('Link berhasil disalin!', 'success');
    }
    
    // Notification function
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type === 'error' ? 'danger' : type} position-fixed`;
      notification.style.cssText = `
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 300px;
        animation: slideInRight 0.5s ease-out;
      `;
      notification.innerHTML = `
        <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info-circle'} me-2"></i>
        ${message}
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.5s ease-in';
        setTimeout(() => notification.remove(), 500);
      }, 3000);
    }
    
    // Add CSS for notifications
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
    
    // Initialize
    updateRemoveButtons();
  </script></body>
</html>
