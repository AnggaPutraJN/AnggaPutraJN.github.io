<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Link - <?= namaGame ?></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .card-header {
            background-color: #4a94bb;
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
            text-align: center;
        }
        .btn-primary {
            background-color: #4a94bb;
            border: none;
            padding: 10px 25px;
        }
        .btn-primary:hover {
            background-color: #3a7b9b;
        }
        .telegram-btn {
            background-color: #0088cc;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .telegram-btn:hover {
            background-color: #0077b3;
            color: white;
            transform: translateY(-2px);
        }
        .telegram-icon {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        .unlock-icon {
            font-size: 3rem;
            color: #4a94bb;
            margin-bottom: 20px;
        }
        .loading-spinner {
            display: none;
            width: 1.5rem;
            height: 1.5rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header py-3">
                <h3>Unlock Link</h3>
                <p class="mb-0"><?= namaGame ?></p>
            </div>
            <div class="card-body text-center">
                <div class="unlock-icon">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h4>Link Dikunci</h4>
                <p class="text-muted">Untuk membuka link ini, Anda harus follow channel Telegram kami terlebih dahulu.</p>
                
                <div class="d-flex flex-column align-items-center mb-4">
                    <a href="https://t.me/iindapk" target="_blank" class="telegram-btn mb-3">
                        <i class="bi bi-telegram telegram-icon"></i>
                        Follow @iindapk
                    </a>
                    <small class="text-muted">Klik tombol di atas untuk membuka Telegram</small>
                </div>
                
                <p>Setelah follow, klik tombol di bawah ini untuk membuka link:</p>
                
                <button class="btn btn-primary" id="unlockBtn">
                    <span id="unlockText">Buka Link</span>
                    <span class="spinner-border spinner-border-sm loading-spinner" id="unlockSpinner" role="status" aria-hidden="true"></span>
                </button>
            </div>
            <div class="card-footer text-muted text-center">
                <small>© 2023 Link2Unlock by INDapk</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5tvWycqduUEfKnlFqQ4q7oqVrBMxd3v4jMqEJyZtaSK3be0S8vEefDDbGpCBAiPo/exec';
        
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get('id');
            const unlockBtn = document.getElementById('unlockBtn');
            const unlockText = document.getElementById('unlockText');
            const unlockSpinner = document.getElementById('unlockSpinner');
            
            if (!linkId) {
                Swal.fire({
                    icon: 'error',
                    title: 'Link Tidak Valid',
                    text: 'Link unlock tidak valid atau sudah kadaluarsa',
                    confirmButtonText: 'OK'
                }).then(() => {
                    window.location.href = 'index.html';
                });
                return;
            }
            
            unlockBtn.addEventListener('click', function() {
                unlockText.textContent = 'Memverifikasi...';
                unlockSpinner.style.display = 'inline-block';
                unlockBtn.disabled = true;
                
                // Send unlock request
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: 'unlock',
                        linkId: linkId
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // Redirect to target URL
                        window.location.href = data.redirectUrl;
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal Unlock',
                            text: data.message || 'Pastikan Anda sudah follow channel Telegram kami',
                            confirmButtonText: 'OK'
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Terjadi kesalahan saat menghubungkan ke server'
                    });
                })
                .finally(() => {
                    unlockText.textContent = 'Buka Link';
                    unlockSpinner.style.display = 'none';
                    unlockBtn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
