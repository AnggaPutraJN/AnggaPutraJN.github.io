<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Noted2Unlock</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

	<style type="text/css">@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.2s ease, border-color 0.3s ease;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
      position: relative;
      overflow-x: hidden;
    }
    
    body.dark-mode {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="40" cy="60" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="60" cy="80" r="1" fill="%23ffffff" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      pointer-events: none;
      z-index: -1;
    }
    
    body.dark-mode::before {
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="%23000000" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="%23000000" opacity="0.1"/><circle cx="40" cy="60" r="1" fill="%23000000" opacity="0.1"/><circle cx="60" cy="80" r="1" fill="%23000000" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
    }
    
    .container {
      max-width: 650px;
    }
    
    .main-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);

      overflow: hidden;
      animation: slideUp 0.8s ease-out;
    }
    
    body.dark-mode .main-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.02);
    }
    
    @keyframes slideUp {

        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .card-header {
      background: linear-gradient(135deg, #4a94bb, #3a7bd5);
      color: white;
      padding: 2rem;
      text-align: center;
      position: relative;
    }
    
    .card-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }
    
    .card-header h3 {
      margin: 0;
      font-weight: 700;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    
    .card-header .icon {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.5rem;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    
    .card-body {
      padding: 2.5rem;
      text-align: center;
    }
    
    .unlock-description {
      color: #4a5568;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    body.dark-mode .unlock-description {
      color: #cbd5e1;
    }
    
    .telegram-btn {
      background: linear-gradient(135deg, #0088cc, #0077b3);
      border: none;
      color: white;
      padding: 1rem 2rem;
      border-radius: 15px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    
    .telegram-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    
    .telegram-btn:hover::before {
      left: 100%;
    }
    
    .telegram-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
      color: white;
      text-decoration: none;
    }
    
    .telegram-btn:active {
      transform: translateY(-1px);
    }
    
    #followCheckContainer {
      margin: 1.5rem 0;
      display: none;
      animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .form-check {
      background: rgba(74, 148, 187, 0.1);
      padding: 1rem;
      border-radius: 15px;
      border: 2px solid rgba(74, 148, 187, 0.2);
      transition: all 0.3s ease;
    }
    
    body.dark-mode .form-check {
      background: rgba(74, 148, 187, 0.2);
      border: 2px solid rgba(74, 148, 187, 0.3);
    }
    
    .form-check:hover {
      background: rgba(74, 148, 187, 0.15);
      border-color: rgba(74, 148, 187, 0.3);
    }
    
    body.dark-mode .form-check:hover {
      background: rgba(74, 148, 187, 0.3);
      border-color: rgba(74, 148, 187, 0.4);
    }
    
    .form-check-input {
      transform: scale(1.2);
      margin-right: 0.75rem;
    }
    
    .form-check-input:checked {
      background-color: #4a94bb;
      border-color: #4a94bb;
    }
    
    .form-check-label {

    }
    
    body.dark-mode .form-check-label {

    }
    
    .btn-primary {

      border-radius: 15px;

      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-top: 1rem;
    }
    
    .btn-primary::before {

      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    
    .btn-primary:hover::before {
      left: 100%;
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(74, 148, 187, 0.4);
    }
    
    .btn-primary:disabled {
      background: linear-gradient(135deg, #cbd5e0, #a0aec0);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    body.dark-mode .btn-primary:disabled {
      background: linear-gradient(135deg, #4b5563, #6b7280);
    }
    
    .alert {
      border-radius: 15px;
      border: none;
      backdrop-filter: blur(10px);
    }
    
    .alert-warning {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.1));
      color: #92400e;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    
    body.dark-mode .alert-warning {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2));
      color: #fef08a;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    
    .alert-success {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(22, 163, 74, 0.1));
      color: #166534;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    
    body.dark-mode .alert-success {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(22, 163, 74, 0.2));
      color: #bbf7d0;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .alert-heading {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .spinner-border {
      display: none;
    }
    
    #unlockButton[disabled] .spinner-border {
      display: inline-block;
    }
    
    #unlockButton[disabled] .button-text {
      display: none;
    }
    
    /* Improved Note Content Styling */
    #successContent {
      text-align: left;
    }
    
    #noteName {
      color: #2d3748;
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      padding: 1rem;
      background: linear-gradient(135deg, rgba(74, 148, 187, 0.1), rgba(58, 123, 213, 0.1));
      border-radius: 15px;
      border: 1px solid rgba(74, 148, 187, 0.2);
    }
    
    body.dark-mode #noteName {
      color: #f8fafc;
      background: linear-gradient(135deg, rgba(74, 148, 187, 0.2), rgba(58, 123, 213, 0.2));
      border: 1px solid rgba(74, 148, 187, 0.3);
    }
    
    #noteContent {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      border-radius: 20px;
      padding: 2rem;
      margin-top: 1.5rem;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.1);
      line-height: 1.8;
      font-size: 1rem;
      color: #2d3748;
      max-height: 500px;
      overflow-y: auto;
    }
    
    body.dark-mode #noteContent {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
    }
    
    /* Custom scrollbar for note content */
    #noteContent::-webkit-scrollbar {
      width: 8px;
    }
    
    #noteContent::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }
    
    body.dark-mode #noteContent::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    
    #noteContent::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #4a94bb, #3a7bd5);
      border-radius: 10px;
    }
    
    #noteContent::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #3a7bd5, #2563eb);
    }
    
    /* Note content text styling */
    .note-line {
      margin-bottom: 0.8rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    
    body.dark-mode .note-line {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .note-line:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    
    /* Link styling within notes */
    .note-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #4a94bb;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      background: rgba(74, 148, 187, 0.1);
      border-radius: 10px;
      border: 1px solid rgba(74, 148, 187, 0.2);
      transition: all 0.3s ease;
      margin: 0.2rem 0;
      word-break: break-all;
    }
    
    body.dark-mode .note-link {
      color: #7dd3fc;
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.2);
    }
    
    .note-link:hover {
      color: #3a7bd5;
      background: rgba(74, 148, 187, 0.2);
      border-color: rgba(74, 148, 187, 0.3);
      text-decoration: none;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 148, 187, 0.2);
    }
    
    body.dark-mode .note-link:hover {
      color: #93c5fd;
      background: rgba(147, 197, 253, 0.2);
      border-color: rgba(147, 197, 253, 0.3);
      box-shadow: 0 5px 15px rgba(147, 197, 253, 0.2);
    }
    
    .note-link::before {
      content: 'ðŸ”—';
      font-size: 0.9rem;
    }
    
    /* Special styling for different types of content */
    .note-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #1a365d;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid rgba(74, 148, 187, 0.3);
    }
    
    body.dark-mode .note-title {
      color: #bfdbfe;
      border-bottom: 2px solid rgba(125, 211, 252, 0.3);
    }
    
    .note-info {
      background: rgba(59, 130, 246, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
      margin: 0.5rem 0;
      font-weight: 500;
    }
    
    body.dark-mode .note-info {
      background: rgba(59, 130, 246, 0.2);
      border-left: 4px solid #60a5fa;
    }
    
    .floating-elements {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .floating-element {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    body.dark-mode .floating-element {
      background: rgba(0, 0, 0, 0.1);
    }
    
    .floating-element:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .floating-element:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }
    
    .floating-element:nth-child(3) {
      width: 40px;
      height: 40px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
    
    /* Dark mode toggle switch */
    .theme-switch-wrapper {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      z-index: 100;
    }
    
    .theme-switch {
      display: inline-block;
      height: 34px;
      position: relative;
      width: 60px;
    }
    
    .theme-switch input {
      display: none;
    }
    
    .slider {
      background-color: #ccc;
      bottom: 0;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: .4s;
      border-radius: 34px;
    }
    
    .slider:before {
      background-color: #fff;
      bottom: 4px;
      content: "";
      height: 26px;
      left: 4px;
      position: absolute;
      transition: .4s;
      width: 26px;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background: linear-gradient(135deg, #4a94bb, #3a7bd5);
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .slider i {
      position: absolute;
      color: #fff;
      font-size: 14px;
    }
    
    .slider .sun {
      left: 6px;
      top: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .slider .moon {
      right: 6px;
      top: 6px;
      opacity: 1;
      transition: opacity 0.2s;
    }
    
    input:checked + .slider .sun {
      opacity: 1;
    }
    
    input:checked + .slider .moon {
      opacity: 0;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 0 1rem;
        max-width: 100%;
      }
      
      .card-body {
        padding: 1.5rem;
      }
      
      .card-header {
        padding: 1.5rem;
      }
      
      .card-header h3 {
        font-size: 1.5rem;
      }
      
      #noteContent {
        padding: 1.5rem;
        font-size: 0.9rem;
      }
      
      .note-link {
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
      }
      
      .theme-switch-wrapper {
        top: 10px;
        right: 10px;
      }
      
      .theme-switch {
        height: 28px;
        width: 50px;
      }
      
      .slider:before {
        height: 20px;
        width: 20px;
      }
      
      input:checked + .slider:before {
        transform: translateX(22px);
      }
      
      .slider i {
        font-size: 12px;
      }
    }


	</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyS6G-Y_h9w5oYunatsu0Wihhds_hJ6QfZT2tMdclasP9R9HEfKeiAQsTTPPCRLZOg/exec';
    
    // Function to format note content with proper styling and clickable links
    function formatNoteContent(content) {
      const lines = content.split('\n').filter(line => line.trim() !== '');
      let formattedContent = '';
      
      lines.forEach((line, index) => {
        const trimmedLine = line.trim();
        
        // Check if line is a URL
        if (isValidUrl(trimmedLine)) {
          const domain = extractDomain(trimmedLine);
          formattedContent += `<div class="note-line">
            Download Link via ${domain} : <a href="${trimmedLine}" class="note-link" target="_blank" rel="noopener noreferrer">
              ${domain || trimmedLine}
            </a>
          </div>`;
        }
        // Check if it's the first line (likely title)
        else if (index === 0 && trimmedLine.length > 0) {
          formattedContent += `<div class="note-title">${escapeHtml(trimmedLine)}</div>`;
        }
        // Check if it contains file size or other info (GB, MB, etc.)
        else if (trimmedLine.match(/\d+\.\d+\s*(GB|MB|KB)/i) || 
                 trimmedLine.match(/^(Fighting|Action|Adventure|Racing|Sports|USA|EUR|JPN)$/i)) {
          formattedContent += `<div class="note-info">${escapeHtml(trimmedLine)}</div>`;
        }
        // Regular text
        else if (trimmedLine.length > 0) {
          formattedContent += `<div class="note-line">${escapeHtml(trimmedLine)}</div>`;
        }
      });
      
      return formattedContent;
    }
    
    // Function to check if a string is a valid URL
    function isValidUrl(string) {
      try {
        new URL(string);
        return string.startsWith('http://') || string.startsWith('https://');
      } catch (_) {
        return false;
      }
    }
    
    // Function to extract domain from URL for display
    function extractDomain(url) {
      try {
        const domain = new URL(url).hostname;
        return domain.replace('www.', '');
      } catch (_) {
        return null;
      }
    }
    
    // Function to escape HTML characters
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      // Dark mode toggle functionality
      const toggleSwitch = document.querySelector('#checkbox');
      const currentTheme = localStorage.getItem('theme');
      
      if (currentTheme) {
        document.body.classList.add(currentTheme);
        if (currentTheme === 'dark-mode') {
          toggleSwitch.checked = true;
        }
      }
      
      function switchTheme(e) {
        if (e.target.checked) {
          document.body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark-mode');
        } else {
          document.body.classList.remove('dark-mode');
          localStorage.setItem('theme', 'light-mode');
        }
      }
      
      toggleSwitch.addEventListener('change', switchTheme, false);
      
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      
      if (!id) {
        showNotification('Link tidak valid', 'error');
        return;
      }
      
      // Show follow checkbox after user clicks Telegram link
      document.getElementById('telegramLink').addEventListener('click', function() {
        setTimeout(() => {
          document.getElementById('followCheckContainer').style.display = 'block';
        }, 1000); // Delay to give user time to follow
      });
      
      // Enable unlock button when checkbox is checked
      document.getElementById('followCheckbox').addEventListener('change', function() {
        document.getElementById('unlockButton').disabled = !this.checked;
      });
      
      // Get IP address
      fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(ipData => {
          const userIp = ipData.ip;
          
          // Set up unlock button
          document.getElementById('unlockButton').addEventListener('click', function() {
            this.disabled = true;
            
            const payload = {
              action: 'verify',
              id: id,
              ip: userIp
            };
            
            fetch(SCRIPT_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams(payload)
            })
            .then(response => response.json())
            .then(data => {
              if (data.status === 'success') {
                // Show success content
                document.getElementById('unlockContent').style.display = 'none';
                document.getElementById('successContent').style.display = 'block';
                
                // Update note title
                document.getElementById('noteTitle').innerHTML = `
                  <div class="icon">
                    <i class="bi bi-check-circle"></i>
                  </div>
                  ${data.data.nama_note || 'Noted2Unlock'}
                `;
                
                // Display note content with formatting
                document.getElementById('noteName').textContent = data.data.nama_note;
                document.getElementById('noteContent').innerHTML = formatNoteContent(data.data.note_content);
                
                showNotification('Verifikasi berhasil!', 'success');
              } else {
                showNotification('Verifikasi gagal: ' + data.message, 'error');
                this.disabled = false;
              }
            })
            .catch(error => {
              showNotification('Terjadi kesalahan: ' + error.message, 'error');
              this.disabled = false;
            });
          });
        })
        .catch(error => {
          console.error('Error getting IP:', error);
          showNotification('Tidak dapat mendeteksi IP. Silakan coba lagi.', 'error');
        });
    });
    
    // Notification function
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type === 'error' ? 'danger' : type} position-fixed`;
      notification.style.cssText = `
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 300px;
        animation: slideInRight 0.5s ease-out;
        backdrop-filter: blur(10px);
        border-radius: 15px;
      `;
      notification.innerHTML = `
        <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info-circle'} me-2"></i>
        ${message}
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.5s ease-in';
        setTimeout(() => notification.remove(), 500);
      }, 3000);
    }
    
    // Add CSS for notifications
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
  </script></body>
