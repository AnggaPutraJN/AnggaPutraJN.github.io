<!DOCTYPE html>
<html>
<head>
<title>Generator Kode Share Game Switch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
:root {
  --primary-bg: #0a0a0a;
  --secondary-bg: #1a1a1a;
  --card-bg: #2a2a2a;
  --text-primary: #7CC6ED;
  --text-secondary: #7CC6ED;
  --accent-color: #00d4ff;
  --accent-secondary: #ff006e;
  --accent-green: #00ff88;
  --border-color: #333;
  --neon-glow: 0 0 20px;
  --placeholder-color: #888;
}

[data-theme="light"] {
  --primary-bg: #f8f9fa;
  --secondary-bg: #ffffff;
  --card-bg: #ffffff;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --accent-color: #0066cc;
  --accent-secondary: #dc3545;
  --accent-green: #28a745;
  --border-color: #dee2e6;
  --neon-glow: 0 0 10px;
  --placeholder-color: #6c757d;
}

* {
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
  color: var(--text-primary);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  transition: all 0.3s ease;
}

/* Navigation Styles */
.nav-section {
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--accent-color);
  padding: 1rem 0;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-buttons {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
}

.nav-btn {
  padding: 12px 24px;
  border-radius: 25px;
  text-decoration: none;
  color: white;
  font-weight: 600;
  transition: all 0.3s ease;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}

.btn-gradient-bg3 {
  background: linear-gradient(45deg, var(--accent-color), var(--accent-green));
  box-shadow: var(--neon-glow) var(--accent-color);
}

.btn-gradient-bg5 {
  background: linear-gradient(45deg, var(--accent-secondary), var(--accent-color));
  box-shadow: var(--neon-glow) var(--accent-secondary);
}

.nav-btn:hover {
  transform: translateY(-3px);
  color: white;
  box-shadow: var(--neon-glow) var(--accent-color), 0 8px 25px rgba(0, 0, 0, 0.3);
}

/* Format Selection Modal */
.format-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  backdrop-filter: blur(10px);
}

.format-modal.hidden {
  display: none;
}

.format-modal-content {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 2.5rem;
  max-width: 500px;
  width: 90%;
  text-align: center;
  border: 2px solid var(--accent-color);
  box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
  animation: modalAppear 0.5s ease-out;
}

@keyframes modalAppear {
  from {
    opacity: 0;
    transform: translateY(-50px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.format-modal h2 {
  color: var(--accent-color);
  margin-bottom: 1.5rem;
  font-size: 1.8rem;
}

.format-options {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin: 2rem 0;
}

.format-btn {
  padding: 15px;
  border-radius: 15px;
  border: 2px solid var(--border-color);
  background: var(--secondary-bg);
  color: var(--text-primary);
  font-weight: 600;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.format-btn:hover {
  transform: translateY(-3px);
  border-color: var(--accent-color);
  box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
}

.format-btn.active {
  background: linear-gradient(135deg, var(--accent-color), var(--accent-green));
  color: white;
  border-color: var(--accent-color);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
}

.format-btn i {
  font-size: 1.2rem;
}

.format-note {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-top: 1rem;
  font-style: italic;
}

/* Theme Switch */
.theme-switch-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1001;
}

.theme-switch {
  position: relative;
  width: 60px;
  height: 30px;
  background: var(--card-bg);
  border-radius: 15px;
  border: 2px solid var(--accent-color);
  cursor: pointer;
  transition: all 0.3s ease;
}

.theme-switch::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  background: var(--accent-color);
  border-radius: 50%;
  transition: all 0.3s ease;
  box-shadow: 0 0 10px var(--accent-color);
}

.theme-switch.active::before {
  transform: translateX(28px);
}

/* Container Styles */
.container-fluid {
  padding: 2rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* Card Styles */
.custom-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.custom-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}

.custom-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.card-header {
  background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
  color: white;
  padding: 1.5rem;
  border-radius: 20px 20px 0 0;
  text-align: center;
}

.card-header h2 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.card-body {
  padding: 2rem;
}

/* Form Styles */
.form-control, input[type="text"] {
  background: var(--secondary-bg);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  color: var(--text-primary);
  padding: 12px 16px;
  font-size: 1rem;
  transition: all 0.3s ease;
  margin-bottom: 1rem;
  width: 100%;
}

.form-control:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--accent-color);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
  background: var(--card-bg);
}

/* Placeholder Styles - Fixed */
.form-control::placeholder, 
input[type="text"]::placeholder,
textarea::placeholder {
  color: var(--placeholder-color) !important;
  opacity: 1;
}

.form-control::-webkit-input-placeholder,
input[type="text"]::-webkit-input-placeholder,
textarea::-webkit-input-placeholder {
  color: var(--placeholder-color) !important;
}

.form-control::-moz-placeholder,
input[type="text"]::-moz-placeholder,
textarea::-moz-placeholder {
  color: var(--placeholder-color) !important;
  opacity: 1;
}

.form-control:-ms-input-placeholder,
input[type="text"]:-ms-input-placeholder,
textarea:-ms-input-placeholder {
  color: var(--placeholder-color) !important;
}

.form-control:-moz-placeholder,
input[type="text"]:-moz-placeholder,
textarea:-moz-placeholder {
  color: var(--placeholder-color) !important;
  opacity: 1;
}

textarea.form-control {
  min-height: 200px;

  font-family: 'Courier New', monospace;
}

label {
  color: var(--text-primary);
  font-weight: 600;
  margin-bottom: 0.5rem;
  display: block;
}

/* Size Input Container */
.size-input-container {
  display: flex;
  gap: 1rem;
  margin-bottom: 1rem;
}

.size-input {
  flex: 1;
}

/* Button Styles */
.btn-custom {
  padding: 12px 30px;
  border-radius: 25px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}

.btn-custom::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);

}

.btn-custom:hover::before {

}

.btn-primary-custom {
  background: linear-gradient(45deg, var(--accent-color), var(--accent-green));
  color: white;
  box-shadow: var(--neon-glow) var(--accent-color);
}

.btn-secondary-custom {
  background: linear-gradient(45deg, #6c757d, #495057);
  color: white;
}

.btn-danger-custom {
  background: linear-gradient(45deg, var(--accent-secondary), #ff4757);
  color: white;
  box-shadow: var(--neon-glow) var(--accent-secondary);
}

.btn-custom:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

/* Result Section */
#result {
  background: var(--card-bg);
  border: 2px solid var(--accent-color);
  border-radius: 15px;
  padding: 20px;
  margin-top: 20px;
  font-family: 'Courier New', monospace;
  white-space: pre-wrap;
  color: var(--text-primary);
  box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.1);
  min-height: 100px;
}

/* Format Indicator */
.format-indicator {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--card-bg);
  border: 2px solid var(--accent-color);
  border-radius: 15px;
  padding: 10px 15px;
  font-weight: 600;
  color: var(--accent-color);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
}

.format-indicator i {
  font-size: 1.2rem;
}

/* Responsive Design */
@media (max-width: 768px) {
  .nav-buttons {
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  
  .container-fluid {
    padding: 1rem;
  }
  
  .theme-switch-container {
    top: 10px;
    right: 10px;
  }
  
  .card-body {
    padding: 1rem;
  }
  
  .format-modal-content {
    padding: 1.5rem;
  }
  
  .format-btn {
    padding: 12px;
    font-size: 1rem;
  }
  
  .format-indicator {

    font-size: 0.9rem;
    padding: 8px 12px;
  }
  
  .size-input-container {
    flex-direction: column;
    gap: 0.5rem;
  }
}

/* Loading Animation */
.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: var(--accent-color);
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Success Animation */
.success-animation {
  animation: pulse 0.5s ease-in-out;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Scrollbar Styling */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--secondary-bg);
}

::-webkit-scrollbar-thumb {
  background: var(--accent-color);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent-secondary);
}

.form-check {
    margin-bottom: 0.5rem;
}

.form-check-input {
    width: 1.2em;

.form-check-input:checked {
    background-color: var(--accent-color);

}

.form-check-input:focus {
    box-shadow: 0 0 0 0.25rem rgba(0, 212, 255, 0.25);
}

.form-check-label {
    margin-left: 0.5rem;
    color: var(--text-primary);
    cursor: pointer;
}
</style>

<script>
// Global variable untuk menyimpan format yang dipilih
let selectedFormat = 'both'; // Default: NSP DAN XCI

// Fungsi untuk mendapatkan nama format
function getFormatName(format) {
  switch(format) {
    case 'only-nsp': return 'ONLY NSP';
    case 'only-xci': return 'ONLY XCI';
    case 'both': return 'NSP DAN XCI';
    default: return 'NSP DAN XCI';
  }
}

// Fungsi untuk mengupdate input fields berdasarkan format
function updateSizeInputs() {
  const container = document.getElementById('sizeInputsContainer');
  
  if (selectedFormat === 'only-nsp') {
    container.innerHTML = `
      <label for="inputSingleSizeNSP"><i class="fas fa-hdd"></i> Ukuran NSP Game:</label>
      <input type="text" id="inputSingleSizeNSP" name="inputSingleSizeNSP" placeholder="Contoh: 5.2 GB">
    `;
  } else if (selectedFormat === 'only-xci') {
    container.innerHTML = `
      <label for="inputSingleSizeXCI"><i class="fas fa-compact-disc"></i> Ukuran XCI Game:</label>
      <input type="text" id="inputSingleSizeXCI" name="inputSingleSizeXCI" placeholder="Contoh: 5.8 GB">
    `;
  } else {
    container.innerHTML = `
      <div class="size-input-container">
        <div class="size-input">
          <label for="inputSingleSizeNSP"><i class="fas fa-hdd"></i> Ukuran NSP Game:</label>
          <input type="text" id="inputSingleSizeNSP" name="inputSingleSizeNSP" placeholder="Contoh: 5.2 GB">
        </div>
        <div class="size-input">
          <label for="inputSingleSizeXCI"><i class="fas fa-compact-disc"></i> Ukuran XCI Game:</label>
          <input type="text" id="inputSingleSizeXCI" name="inputSingleSizeXCI" placeholder="Contoh: 5.8 GB">
        </div>
      </div>
    `;
  }
}

// Format Selection Modal
document.addEventListener('DOMContentLoaded', function() {
  const formatModal = document.getElementById('formatModal');
  const formatButtons = document.querySelectorAll('.format-btn');
  const confirmBtn = document.getElementById('confirmFormatBtn');
  const formatIndicator = document.getElementById('formatIndicator');
  const formatIndicatorText = document.getElementById('formatIndicatorText');
  
  // Cek apakah format sudah dipilih sebelumnya
  const savedFormat = localStorage.getItem('gameFormat');
  if (savedFormat) {
    selectedFormat = savedFormat;
    formatModal.classList.add('hidden');
    formatIndicator.style.display = 'flex';
    updateFormatIndicator();
    updateSizeInputs();
  }
  
  // Format button click handler
  formatButtons.forEach(button => {
    button.addEventListener('click', function() {
      formatButtons.forEach(btn => btn.classList.remove('active'));
      this.classList.add('active');
    });
  });
  
  // Confirm button click handler
  confirmBtn.addEventListener('click', function() {
    const activeBtn = document.querySelector('.format-btn.active');
    selectedFormat = activeBtn.getAttribute('data-format');
    
    // Simpan ke localStorage
    localStorage.setItem('gameFormat', selectedFormat);
    
    // Sembunyikan modal
    formatModal.classList.add('hidden');
    
    // Tampilkan indicator
    formatIndicator.style.display = 'flex';
    updateFormatIndicator();
    
    // Update input fields
    updateSizeInputs();
    
    // Tampilkan notifikasi
    showNotification(`Format ${getFormatName(selectedFormat)} dipilih!`, 'success');
  });
  
  // Fungsi untuk mengupdate format indicator
  function updateFormatIndicator() {
    formatIndicatorText.textContent = getFormatName(selectedFormat);
    
    // Update icon berdasarkan format
    const icon = formatIndicator.querySelector('i');
    if (selectedFormat === 'only-nsp') {
      icon.className = 'fas fa-gamepad';
      formatIndicator.style.borderColor = '#00ff88';
    } else if (selectedFormat === 'only-xci') {
      icon.className = 'fas fa-compact-disc';
      formatIndicator.style.borderColor = '#ff006e';
    } else {
      icon.className = 'fas fa-layer-group';
      formatIndicator.style.borderColor = '#00d4ff';
    }
  }
  
  // Tampilkan modal jika format belum dipilih
  if (!savedFormat) {
    setTimeout(() => {
      formatModal.classList.remove('hidden');
    }, 500);
  } else {
    // Jika sudah ada format yang disimpan, update input fields
    updateSizeInputs();
  }
});

// Fungsi untuk mengubah format
function changeFormat() {
  const formatModal = document.getElementById('formatModal');
  formatModal.classList.remove('hidden');
  
  // Set active button sesuai dengan format yang dipilih
  const buttons = document.querySelectorAll('.format-btn');
  buttons.forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('data-format') === selectedFormat) {
      btn.classList.add('active');
    }
  });
}

// Theme Toggle Function
function toggleTheme() {
  const body = document.body;
  const themeSwitch = document.querySelector('.theme-switch');
  
  if (body.getAttribute('data-theme') === 'light') {
    body.removeAttribute('data-theme');
    themeSwitch.classList.remove('active');
  } else {
    body.setAttribute('data-theme', 'light');
    themeSwitch.classList.add('active');
  }
}

function clearCode() {
  const resultDiv = document.getElementById("result");
  resultDiv.innerText = "";
  
  // Add animation
  resultDiv.style.animation = 'pulse 0.3s ease-out';
  setTimeout(() => {
    resultDiv.style.animation = '';
  }, 300);

  // Clear all inputs and textarea
  const allInputs = document.querySelectorAll('input, textarea');
  allInputs.forEach(input => {
    input.value = '';
  });
}

function copyCode() {
  const resultDiv = document.getElementById("result");
  const generatedHtml = resultDiv.innerText;

  if (generatedHtml.trim() === "") {
    showNotification("Maaf, codingan belum dibuat!", "error");
    return;
  }

  const tempTextarea = document.createElement("textarea");
  tempTextarea.value = generatedHtml;
  document.body.appendChild(tempTextarea);
  tempTextarea.select();
  document.execCommand("copy");
  document.body.removeChild(tempTextarea);
  
  showNotification("Codingan berhasil disalin!", "success");
  
  // Add success animation
  resultDiv.classList.add('success-animation');
  setTimeout(() => {
    resultDiv.classList.remove('success-animation');
  }, 500);
}

// Notification function
function showNotification(message, type) {
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 25px;
    border-radius: 25px;
    color: white;
    font-weight: 600;
    z-index: 10000;
    animation: slideDown 0.3s ease-out;
    ${type === 'success' ? 'background: linear-gradient(45deg, #00ff88, #00d4ff);' : 'background: linear-gradient(45deg, #ff006e, #ff4757);'}
  `;
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.style.animation = 'slideUp 0.3s ease-out forwards';
    setTimeout(() => notification.remove(), 300);
  }, 3000);
}

const textarea = document.getElementById('myTextarea');
const form = document.getElementById('myForm');

// Event listener untuk textarea
textarea.addEventListener('input', () => {
  const text = textarea.value.trim();
  const values = text.split('\n');
  
  // Update input fields yang sesuai dengan format
  const inputs = form.querySelectorAll('input');
  let inputIndex = 0;
  
  inputs.forEach((input, index) => {
    if (values[inputIndex]) {
      input.value = values[inputIndex];
      inputIndex++;
    } else {
      input.value = '';
    }
  });
});

textarea.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();

    const inputs = form.querySelectorAll('input');
    const currentIndex = Array.from(inputs).findIndex((input) => input === document.activeElement);

    if (currentIndex === -1) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;

      textarea.value = textarea.value.substring(0, start) + '\n' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 1;
    } else {
      const nextIndex = currentIndex + 1;

      if (nextIndex < inputs.length) {
        inputs[nextIndex].focus();
      }
    }
  }
});
