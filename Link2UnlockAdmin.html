// Theme Management
class ThemeManager {
  constructor() {
    this.currentTheme = localStorage.getItem('theme') || 'light';
    this.lightBtn = document.getElementById('lightThemeBtn');
    this.darkBtn = document.getElementById('darkThemeBtn');
    
    this.init();
  }
  
  init() {
    // Apply saved theme
    this.applyTheme(this.currentTheme);
    
    // Add event listeners
    this.lightBtn.addEventListener('click', () => this.switchTheme('light'));
    this.darkBtn.addEventListener('click', () => this.switchTheme('dark'));
  }
  
  switchTheme(theme) {
    this.currentTheme = theme;
    this.applyTheme(theme);
    localStorage.setItem('theme', theme);
    this.showThemeNotification(theme);
  }
  
  applyTheme(theme) {
    const body = document.body;
    
    if (theme === 'dark') {
      body.classList.add('dark-theme');
      this.darkBtn.classList.add('active');
      this.lightBtn.classList.remove('active');
    } else {
      body.classList.remove('dark-theme');
      this.lightBtn.classList.add('active');
      this.darkBtn.classList.remove('active');
    }
    
    // Add smooth transition
    body.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      body.style.transition = '';
    }, 300);
  }
  
  showThemeNotification(theme) {
    const message = theme === 'dark' ? 'Tema gelap diaktifkan' : 'Tema terang diaktifkan';
    const icon = theme === 'dark' ? 'moon-fill' : 'sun-fill';
    
    const notification = document.createElement('div');
    notification.className = 'alert alert-info position-fixed';
    notification.style.cssText = `
      top: 80px;
      right: 20px;
      z-index: 9999;
      min-width: 250px;
      animation: slideInRight 0.5s ease-out;
      backdrop-filter: blur(10px);
    `;
    notification.innerHTML = `
      <i class="bi bi-${icon} me-2"></i>
      ${message}
    `;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
      notification.style.animation = 'slideOutRight 0.5s ease-in';
      setTimeout(() => notification.remove(), 500);
    }, 2000);
  }
}

      // Add remove functionality
      gameItem.querySelector('.remove-game-btn').addEventListener('click', function() {
        gameItem.style.transition = 'all 0.3s ease';
        gameItem.style.opacity = '0';
        gameItem.style.transform = 'translateX(-100%)';
        setTimeout(() => {
          gameItem.remove();
          updateGameCount();
          updateRemoveButtons();
          updateGameNumbers();
        }, 300);
      });
      
      return gameItem;
    }
    
    // Update game count
    function updateGameCount() {
      const count = document.querySelectorAll('.game-item').length;
      document.getElementById('gameCount').textContent = count;
    }
    
    // Update remove buttons visibility
    function updateRemoveButtons() {
      const gameItems = document.querySelectorAll('.game-item');
      const removeButtons = document.querySelectorAll('.remove-game-btn');
      
      if (gameItems.length <= 1) {
        removeButtons.forEach(btn => btn.style.display = 'none');
      } else {
        removeButtons.forEach(btn => btn.style.display = 'block');
      }
    }
    
    // Update game numbers
    function updateGameNumbers() {
      const gameItems = document.querySelectorAll('.game-item');
      gameItems.forEach((item, index) => {
        const title = item.querySelector('h6');
        title.innerHTML = `
          <i class="bi bi-controller me-2"></i>
          Game #${index + 1}
        `;
      });
    }
    
    // Form submission
    document.getElementById('bulkLinkForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const gameItems = document.querySelectorAll('.game-item');
      const games = [];
      
      // Collect all game data
      gameItems.forEach(item => {
        const namaGame = item.querySelector('.nama-game').value;
        const linkTujuan = item.querySelector('.link-tujuan').value;
        
        if (namaGame && linkTujuan) {
          games.push({
            nama_game: namaGame,
            link_tujuan: linkTujuan
          });
        }
      });
      
      if (games.length === 0) {
        showNotification('Mohon isi minimal satu game!', 'error');
        return;
      }
      
      // Show loading state
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memproses...';
      
      try {
        const results = [];
        
        // Process each game
        for (let i = 0; i < games.length; i++) {
          const game = games[i];
          const payload = {
            action: 'create',
            nama_game: game.nama_game,
            link_tujuan: game.link_tujuan
          };
          
          try {
            const response = await fetch(SCRIPT_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams(payload)
            });
            
            const data = await response.json();
            
            if (data.status === 'success') {
              results.push({
                nama_game: game.nama_game,
                shareableLink: data.data.shareableLink,
                success: true
              });
            } else {
              results.push({
                nama_game: game.nama_game,
                error: data.message,
                success: false
              });
            }
          } catch (error) {
            results.push({
              nama_game: game.nama_game,
              error: error.message,
              success: false
            });
          }
          
          // Update progress
          submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memproses... (${i + 1}/${games.length})`;
        }
        
        // Display results
        displayResults(results);
        
        // Reset form
        document.getElementById('bulkLinkForm').reset();
        
        // Show success notification
        const successCount = results.filter(r => r.success).length;
        const errorCount = results.filter(r => !r.success).length;
        
        if (successCount > 0) {
          showNotification(`${successCount} link berhasil dibuat${errorCount > 0 ? `, ${errorCount} gagal` : ''}!`, 'success');
        }
        if (errorCount > 0 && successCount === 0) {
          showNotification(`Semua link gagal dibuat!`, 'error');
        }
        
      } catch (error) {
        showNotification('Terjadi kesalahan: ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHTML;
      }
    });
    
    // Display results
    function displayResults(results) {
      const resultContainer = document.getElementById('resultContainer');
      const resultsContainer = document.getElementById('resultsContainer');
      
      resultsContainer.innerHTML = '';
      
      results.forEach((result, index) => {
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        
        if (result.success) {
          resultItem.innerHTML = `
            <h6><i class="bi bi-controller me-2"></i>${result.nama_game}</h6>
            <div class="input-group mb-2">
              <input type="text" class="form-control" value="${result.shareableLink}" readonly>
              <button class="btn btn-outline-secondary copy-btn" type="button" data-link="${result.shareableLink}">
                <i class="bi bi-clipboard"></i>
                Copy
              </button>
            </div>
          `;
        } else {
          resultItem.className += ' border-danger';
          resultItem.style.background = 'rgba(239, 68, 68, 0.05)';
          resultItem.innerHTML = `
            <h6 class="text-danger"><i class="bi bi-controller me-2"></i>${result.nama_game}</h6>
            <div class="alert alert-danger mb-0">
              <i class="bi bi-x-circle me-2"></i>
              Error: ${result.error}
            </div>
          `;
        }
        
        resultsContainer.appendChild(resultItem);
      });
      
      // Add copy functionality
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const link = this.getAttribute('data-link');
          copyToClipboard(link, this);
        });
      });
      
      resultContainer.style.display = 'block';
      resultContainer.scrollIntoView({ behavior: 'smooth' });
    }
    
    // Copy to clipboard
    function copyToClipboard(text, button) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyFeedback(button);
        });
      } else {
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showCopyFeedback(button);
      }
    }
    
    // Show copy feedback
    function showCopyFeedback(button) {
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="bi bi-check"></i> Copied!';
      button.classList.remove('btn-outline-secondary');
      button.classList.add('btn-success');
      
      setTimeout(() => {
        button.innerHTML = originalHTML;
        button.classList.remove('btn-success');
        button.classList.add('btn-outline-secondary');
      }, 2000);
      
      showNotification('Link berhasil disalin!', 'success');
    }
    
    // Notification function
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `alert alert-${type === 'error' ? 'danger' : type} position-fixed`;
      notification.style.cssText = `
        top: 20px;
        right: 20px;
        z-index: 9999;
        min-width: 300px;
        animation: slideInRight 0.5s ease-out;
      `;
      notification.innerHTML = `
        <i class="bi bi-${type === 'success' ? 'check-circle' : type === 'error' ? 'x-circle' : 'info-circle'} me-2"></i>
        ${message}
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOutRight 0.5s ease-in';
        setTimeout(() => notification.remove(), 500);
      }, 3000);
    }
    
    // Add CSS for notifications
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOutRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
    
    // Initialize
    updateRemoveButtons();
  </script></body>
</html>
