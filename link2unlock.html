<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link2Unlock Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 2rem;
    }
    .container {
      max-width: 600px;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      background-color: #4a94bb;
      color: white;
      border-radius: 15px 15px 0 0 !important;
    }
    .btn-primary {
      background-color: #4a94bb;
      border-color: #4a94bb;
    }
    .result-container {
      display: none;
      margin-top: 20px;
    }
    #shareableLink {
      cursor: pointer;
    }
    #shareableLink:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header text-center">
        <h3>Link2Unlock Admin</h3>
      </div>
      <div class="card-body">
        <form id="linkForm">
          <div class="mb-3">
            <label for="namaGame" class="form-label">Nama Game</label>
            <input type="text" class="form-control" id="namaGame" required>
          </div>
          <div class="mb-3">
            <label for="linkTujuan" class="form-label">Link Tujuan</label>
            <input type="url" class="form-control" id="linkTujuan" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Generate Link</button>
        </form>
        
        <div class="result-container" id="resultContainer">
          <hr>
          <h5>Link berhasil dibuat!</h5>
          <p>Bagikan link berikut:</p>
          <div class="input-group mb-3">
            <input type="text" class="form-control" id="shareableLink" readonly>
            <button class="btn btn-outline-secondary" type="button" id="copyButton">Copy</button>
          </div>
          <div class="alert alert-info">
            <small>User harus follow Telegram @iindapk dan akan terkunci jika berbeda IP</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqLXCVli_8yvOTWqI0ZgeDiq7y4jMx4Hi89w_NEFsgS2k8Yzxsni_V0a95g_evvpM/exec';
    
    document.getElementById('linkForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const namaGame = document.getElementById('namaGame').value;
      const linkTujuan = document.getElementById('linkTujuan').value;
      
      const payload = {
        action: 'create',
        nama_game: namaGame,
        link_tujuan: linkTujuan
      };
      
      // Show loading state
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Memproses...';
      
      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams(payload)
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          // Show result
          const resultContainer = document.getElementById('resultContainer');
          const shareableLink = document.getElementById('shareableLink');
          
          shareableLink.value = data.data.shareableLink;
          resultContainer.style.display = 'block';
          
          // Reset form
          document.getElementById('linkForm').reset();
        } else {
          alert('Error: ' + data.message);
        }
      })
      .catch(error => {
        alert('Terjadi kesalahan: ' + error.message);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Link';
      });
    });
    
    // Copy button functionality
    document.getElementById('copyButton').addEventListener('click', function() {
      const shareableLink = document.getElementById('shareableLink');
      shareableLink.select();
      document.execCommand('copy');
      
      // Show tooltip or feedback
      const originalText = this.textContent;
      this.textContent = 'Copied!';
      setTimeout(() => {
        this.textContent = originalText;
      }, 2000);
    });
  </script>
</body>
</html>
