<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link2Unlock System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .link-output {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-top: 15px;
            word-break: break-all;
        }

        .copy-btn {
            background: #28a745;
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 20px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .links-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .links-table th,
        .links-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .links-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .links-table tr:hover {
            background: #f8f9fa;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .refresh-btn {
            background: #17a2b8;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #138496;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .links-table {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 Link2Unlock System</h1>
            <p>Buat link yang memerlukan follow Telegram untuk dibuka</p>
        </div>

        <!-- Form Buat Link Baru -->
        <div class="card">
            <h2>🎮 Buat Link Baru</h2>
            <form id="createForm">
                <div class="form-group">
                    <label for="namaGame">Nama Game/Konten:</label>
                    <input type="text" id="namaGame" name="nama_game" required placeholder="Contoh: GTA V Mod, Minecraft Shader, dll">
                </div>
                
                <div class="form-group">
                    <label for="linkTujuan">Link Tujuan:</label>
                    <input type="url" id="linkTujuan" name="link_tujuan" required placeholder="https://example.com/download">
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <span id="submitText">🚀 Buat Link</span>
                    <span id="submitLoading" class="loading">⏳ Membuat...</span>
                </button>
            </form>

            <div id="result" class="result">
                <div id="resultMessage"></div>
                <div id="linkOutput" class="link-output" style="display: none;">
                    <strong>Link yang bisa dibagikan:</strong><br>
                    <span id="shareableLink"></span>
                    <br>
                    <button class="btn copy-btn" onclick="copyLink()">📋 Copy Link</button>
                </div>
            </div>
        </div>

        <!-- Daftar Link yang Sudah Dibuat -->
        <div class="card">
            <h2>📋 Daftar Link</h2>
            <button class="btn refresh-btn" onclick="loadLinks()">🔄 Refresh</button>
            
            <div id="linksLoading" class="loading">⏳ Memuat data...</div>
            
            <div id="linksContainer">
                <table class="links-table" id="linksTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Nama Game</th>
                            <th>Link Tujuan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4uBD_5VwDkrQyCiXidz4XD9pcik5OCxaAkFExmf6hcKUurzHPYJBQIKvyuoCmZvE/exec';

        // Form submission
        document.getElementById('createForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitLoading = document.getElementById('submitLoading');
            const result = document.getElementById('result');
            
            // Show loading state
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitLoading.style.display = 'inline';
            
            try {
                const formData = new FormData(this);
                formData.append('action', 'create');
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showResult('success', data.message);
                    document.getElementById('shareableLink').textContent = data.shareableUrl;
                    document.getElementById('linkOutput').style.display = 'block';
                    this.reset();
                    loadLinks(); // Refresh the links list
                } else {
                    showResult('error', data.message || 'Terjadi kesalahan');
                }
            } catch (error) {
                console.error('Error:', error);
                showResult('error', 'Terjadi kesalahan saat mengirim data');
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitLoading.style.display = 'none';
            }
        });

        function showResult(type, message) {
            const result = document.getElementById('result');
            const resultMessage = document.getElementById('resultMessage');
            
            result.className = `result ${type}`;
            resultMessage.textContent = message;
            result.style.display = 'block';
            
            if (type === 'error') {
                document.getElementById('linkOutput').style.display = 'none';
            }
        }

        function copyLink() {
            const linkText = document.getElementById('shareableLink').textContent;
            navigator.clipboard.writeText(linkText).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✅ Tersalin!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            });
        }

        async function loadLinks() {
            const loading = document.getElementById('linksLoading');
            const table = document.getElementById('linksTable');
            const tbody = document.getElementById('linksTableBody');
            
            loading.style.display = 'block';
            table.style.display = 'none';
            
            try {
                const formData = new FormData();
                formData.append('action', 'read');
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    tbody.innerHTML = '';
                    
                    if (data.data.length > 0) {
                        data.data.forEach(link => {
                            const row = document.createElement('tr');
                            const date = new Date(link.timestamp).toLocaleDateString('id-ID');
                            
                            row.innerHTML = `
                                <td>${date}</td>
                                <td>${link.nama_game}</td>
                                <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${link.link_tujuan}">
                                    ${link.link_tujuan}
                                </td>
                                <td>
                                    <button class="delete-btn" onclick="deleteLink(${link.id})">🗑️ Hapus</button>
                                </td>
                            `;
                            
                            tbody.appendChild(row);
                        });
                        
                        table.style.display = 'table';
                    } else {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #666;">Belum ada link yang dibuat</td></tr>';
                        table.style.display = 'table';
                    }
                } else {
                    console.error('Error loading links:', data.message);
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function deleteLink(id) {
            if (!confirm('Yakin ingin menghapus link ini?')) {
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('action', 'delete');
                formData.append('id', id);
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    loadLinks(); // Refresh the list
                } else {
                    alert('Gagal menghapus link: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat menghapus link');
            }
        }

        // Load links when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadLinks();
        });
    </script>
</body>
</html>
